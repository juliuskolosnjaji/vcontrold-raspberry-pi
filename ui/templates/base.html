<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>{% block title %}vcontrold UI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>
    // Gemeinsamer Live-Werte-Mechanismus für alle Seiten mit CAN-/MQTT-Variablen-Tabellen: die
    // UI hält keine Dauerverbindung zum Broker, sondern holt auf Klick per /api/live-values einen
    // kurzen Snapshot (siehe scripts/mqtt_snapshot.py). Ein Element markiert sich per
    // [data-live]-Attribut als Ziel; der abzufragende Name kommt entweder aus [data-live-name]
    // (fester Name, z.B. bei einer nicht editierbaren <code>-Zelle) oder, falls nicht gesetzt, aus
    // dem aktuellen .value des Elements selbst (Freitext-/Auswahlfelder) -- so werden auch per JS
    // dynamisch hinzugefügte Zeilen ("+ Zeile") automatisch mit erfasst, ohne Sonderbehandlung.
    // Muss im head-Bereich definiert werden, vor dem content-Block -- jede Seite ruft die Funktion
    // in einem eigenen script-Tag INNERHALB ihres content-Blocks auf, also früher im Dokument als
    // ein script am Ende von body stünde.
    function attachLiveValues(button, container) {
      if (!button || !container) return;

      function nameFor(el) {
        return el.dataset.liveName || (el.value || '').trim();
      }

      function badgeFor(el) {
        if (el.tagName === 'SPAN') return el;
        let sib = el.nextElementSibling;
        if (!sib || !sib.classList.contains('live-badge')) {
          sib = document.createElement('span');
          sib.className = 'live-badge';
          el.insertAdjacentElement('afterend', sib);
        }
        return sib;
      }

      button.addEventListener('click', function () {
        const targets = Array.from(container.querySelectorAll('[data-live]'));
        const names = [...new Set(targets.map(nameFor).filter(Boolean))];
        if (!names.length) {
          targets.forEach(function (el) { badgeFor(el).textContent = ''; });
          return;
        }
        button.disabled = true;
        const original = button.textContent;
        button.textContent = 'Lädt…';
        fetch('/api/live-values', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ names: names }),
        })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            targets.forEach(function (el) {
              const name = nameFor(el);
              const badge = badgeFor(el);
              if (name && data[name]) {
                const unit = data[name].unit ? ' ' + data[name].unit : '';
                badge.textContent = '→ ' + data[name].value + unit;
                badge.classList.remove('live-badge-empty');
              } else {
                badge.textContent = name ? '→ –' : '';
                badge.classList.add('live-badge-empty');
              }
            });
          })
          .catch(function () {
            targets.forEach(function (el) { badgeFor(el).textContent = ''; });
          })
          .finally(function () {
            button.disabled = false;
            button.textContent = original;
          });
      });
    }

    // Entfernt die Tabellenzeile eines "+ Zeile hinzufügen"-Buttons wieder -- gilt gleichermaßen
    // für bestehende (server-gerenderte) und per JS neu hinzugefügte Zeilen: die Zeile wird
    // einfach aus dem DOM entfernt, ihre Felder werden dadurch beim Speichern gar nicht erst
    // mitgesendet (siehe app.py: Zeilenindizes kommen aus den tatsächlich übermittelten
    // Formularfeldern, keine feste Anzahl). Fragt nur nach, wenn die Zeile bereits ausgefüllt ist
    // -- eine gerade erst leer hinzugefügte Zeile lässt sich ohne Rückfrage wieder entfernen.
    function removeRow(button) {
      const row = button.closest('tr');
      if (!row) return;
      const hasData = Array.from(row.querySelectorAll('input[type=text], input[type=number], select'))
        .some(function (el) { return el.value && el.value.trim(); });
      if (hasData && !confirm('Diese Zeile wirklich entfernen? Wird erst beim nächsten Speichern endgültig gelöscht.')) {
        return;
      }
      row.remove();
    }
  </script>
</head>
<body>
  <nav>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('vcontrold_page') }}">Vcontrold</a>
    <a href="{{ url_for('mqtt_variables_page') }}">MQTT-Variablen</a>
    <a href="{{ url_for('settings') }}">MQTT-Einstellungen</a>
    <a href="{{ url_for('can_settings') }}">CAN-Einstellungen</a>
    <a href="{{ url_for('diagnostics_page') }}">Diagnose</a>
    <a href="{{ url_for('can_sniffer_page') }}">CAN-Sniffer</a>
    <a href="{{ url_for('logout') }}" class="logout">Abmelden</a>
  </nav>
  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
